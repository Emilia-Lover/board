spring.application.name=board

# 비밀번호 같은 민감한 정보는 application-secret.properties에서 불러와요 (GitHub에 안 올라감)
spring.config.import=optional:classpath:application-secret.properties

# 1) DB 접속 주소
spring.datasource.url=jdbc:mariadb://localhost:3306/board_db
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 2) 서버가 켜질 때 schema.sql 실행 (테이블이 없으면 만들기)
spring.sql.init.mode=always

# 3) MyBatis 설정
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.board.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 4) 실행되는 SQL을 콘솔에서 보기
logging.level.com.example.board.mapper=debug